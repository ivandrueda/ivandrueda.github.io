<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc">
<title id="title">Proposed implementation roadmap</title><desc id="desc">A proposed implementation roadmap connects foundation and alignment, workflow redesign, technology pilot, and rollout and improvement. Each phase has proposed activities and a review gate. The roadmap was well received by hospital stakeholders; deployment and realized benefits remain unverified. Calendar dates are omitted.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718a95"/></marker></defs>
<rect x="0" y="0" width="1200" height="752" rx="0" fill="#ffffff"/>
<text x="36" y="40" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
<tspan x="36" dy="0">05 / DESIGN + ANALYSIS</tspan>
</text>
<text x="36" y="91" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">
<tspan x="36" dy="0">Implementation roadmap</tspan>
</text>
<text x="36" y="128" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">
<tspan x="36" dy="0">Proposed phases connecting people, workflow, technology, and measurement</tspan>
</text>
<rect x="36" y="180" width="264" height="419" rx="12" fill="#f4f8fa"/>
<text x="55" y="214" fill="#315c90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
<tspan x="55" dy="0">PHASE 01</tspan>
</text>
<text x="55" y="257" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="55" dy="0">Foundation</tspan>
<tspan x="55" dy="33">and alignment</tspan>
</text>
<text x="55" y="329" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">
<tspan x="55" dy="0">Clinical + operations leads</tspan>
</text>
<text x="55" y="379" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="55" dy="0">Map workflow and baseline</tspan>
</text>
<text x="55" y="422" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="55" dy="0">Agree governance and KPIs</tspan>
</text>
<text x="55" y="465" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="55" dy="0">Assess data and integration</tspan>
</text>
<rect x="52" y="511" width="232" height="70" rx="8" fill="#ffffff" stroke="#dce6eb"/>
<text x="65" y="533" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
<tspan x="65" dy="0">PROPOSED REVIEW GATE</tspan>
</text>
<text x="65" y="556" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
<tspan x="65" dy="0">Workflow and baseline</tspan>
<tspan x="65" dy="19">agreed</tspan>
</text>
<path d="M303,390 L319,390" fill="none" stroke="#718a95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="180" width="264" height="419" rx="12" fill="#eaf5f4"/>
<text x="343" y="214" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
<tspan x="343" dy="0">PHASE 02</tspan>
</text>
<text x="343" y="257" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="343" dy="0">Workflow</tspan>
<tspan x="343" dy="33">redesign</tspan>
</text>
<text x="343" y="329" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">
<tspan x="343" dy="0">Nurses + clinical teams</tspan>
</text>
<text x="343" y="379" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="343" dy="0">Build readiness checklists</tspan>
</text>
<text x="343" y="422" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="343" dy="0">Define shared scheduling</tspan>
</text>
<text x="343" y="465" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
