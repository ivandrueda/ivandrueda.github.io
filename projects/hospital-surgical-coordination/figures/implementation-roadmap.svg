</text>
<rect x="340" y="511" width="232" height="70" rx="8" fill="#ffffff" stroke="#dce6eb"/>
<text x="353" y="533" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
<tspan x="353" dy="0">PROPOSED REVIEW GATE</tspan>
</text>
<text x="353" y="556" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
<tspan x="353" dy="0">Clinical tabletop</tspan>
<tspan x="353" dy="19">review</tspan>
</text>
<path d="M591,390 L607,390" fill="none" stroke="#718a95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="612" y="180" width="264" height="419" rx="12" fill="#f4f8fa"/>
<text x="631" y="214" fill="#315c90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
<tspan x="631" dy="0">PHASE 03</tspan>
</text>
<text x="631" y="257" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="631" dy="0">Technology</tspan>
<tspan x="631" dy="33">pilot</tspan>
</text>
<text x="631" y="329" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">
<tspan x="631" dy="0">Pilot teams + IT support</tspan>
</text>
<text x="631" y="379" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="631" dy="0">Integrate scheduling views</tspan>
</text>
<text x="631" y="422" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="631" dy="0">Provide role-based training</tspan>
</text>
<text x="631" y="465" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="631" dy="0">Run a controlled pilot</tspan>
</text>
<rect x="628" y="511" width="232" height="70" rx="8" fill="#ffffff" stroke="#dce6eb"/>
<text x="641" y="533" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
<tspan x="641" dy="0">PROPOSED REVIEW GATE</tspan>
</text>
<text x="641" y="556" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
<tspan x="641" dy="0">Pilot readiness</tspan>
<tspan x="641" dy="19">and lessons review</tspan>
</text>
<path d="M879,390 L895,390" fill="none" stroke="#718a95" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="900" y="180" width="264" height="419" rx="12" fill="#f4f8fa"/>
<text x="919" y="214" fill="#315c90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
<tspan x="919" dy="0">PHASE 04</tspan>
</text>
<text x="919" y="257" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="919" dy="0">Rollout and</tspan>
<tspan x="919" dy="33">improvement</tspan>
</text>
<text x="919" y="329" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">
<tspan x="919" dy="0">Clinical + operations leads</tspan>
</text>
<text x="919" y="379" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="919" dy="0">Roll out in stages</tspan>
</text>
<text x="919" y="422" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="919" dy="0">Review process measures</tspan>
</text>
<text x="919" y="465" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">
<tspan x="919" dy="0">Verify benefits and refine</tspan>
</text>
<rect x="916" y="511" width="232" height="70" rx="8" fill="#ffffff" stroke="#dce6eb"/>
<text x="929" y="533" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
<tspan x="929" dy="0">PROPOSED REVIEW GATE</tspan>
</text>
<text x="929" y="556" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
<tspan x="929" dy="0">Sustained process</tspan>
<tspan x="929" dy="19">review</tspan>
</text>
<text x="36" y="650" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="36" dy="0">The roadmap was well received by hospital stakeholders.</tspan>
</text>
<text x="36" y="688" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">
<tspan x="36" dy="0">Phases describe the proposed approach. Implementation and realized benefits remain unverified.</tspan>
</text>
