<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="title desc">
<title id="title">Exploratory Bayesian and workflow simulation approach</title><desc id="desc">Recorded outcomes and literature-informed assumptions feed Bayesian inference and workflow simulation. Alternative coordination structures are explored through assumptions. Process-level measurements are proposed to test them in a future pilot; intervention effects were not validated.</desc>
