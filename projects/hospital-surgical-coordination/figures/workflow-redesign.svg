<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="842" viewBox="0 0 1200 842" role="img" aria-labelledby="title desc">
<title id="title">Moving coordination earlier in the surgical workflow</title><desc id="desc">Current findings show patient preparation, surgery scheduling and anesthesia availability meeting at late reconciliation. Proposed shared coordination connects readiness and scheduling before the OR handoff. Generic patient touchpoints show early preparation, readiness review, and final confirmation without dates.</desc>
