<text x="36" y="40" fill="#177d86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
<tspan x="36" dy="0">01 / DESIGN + ANALYSIS</tspan>
</text>
<text x="36" y="91" fill="#173343" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">
<tspan x="36" dy="0">Whose needs shaped the design</tspan>
</text>
<text x="36" y="128" fill="#536875" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400">
