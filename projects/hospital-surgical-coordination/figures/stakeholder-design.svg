<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img" aria-labelledby="title desc">
<title id="title">Stakeholder needs connected to design and measurement</title><desc id="desc">Five stakeholder groups are connected to design considerations, proposed responses, and proposed process measures. These are a synthesis of the project recommendations, not findings from patient interviews.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718a95"/></marker></defs>
